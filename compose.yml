networks:
  proxiable:
    external: true

services:
  postgres:
    image: postgres:alpine
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=backend
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    image: ghcr.io/invalidjoker/relay-app:main
    container_name: relay-app
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/backend
      - ORIGIN=https://relay.koder.wtf
      - BETTER_AUTH_SECRET="YOUR_SECRET_HERE"
      - PUBLIC_RELAY_DOMAIN=relay.koder.wtf
      - PUBLIC_TCP_DOMAIN=tcp.koder.wtf
      - RELAY_URL=relay.koder.wtf
      - PUBLIC_PORT_RANGE_START=10000
      - PUBLIC_PORT_RANGE_END=20000
    ports:
      - 127.0.0.1:3000:3000
    networks:
      - proxiable

  relay:
    image: ghcr.io/invalidjoker/relay-relay:main
    container_name: relay
    restart: unless-stopped
    # Host networking avoids one docker-proxy process per published port,
    # which exhausts server memory for large port ranges (see readme)
    network_mode: host
    environment:
      - BACKEND_URL=https://relay.koder.wtf
      - PORT_RANGE_START=10000
      - PORT_RANGE_END=20000
      - HTTP_BIND=127.0.0.1
      - HTTP_PORT=8080
      - HTTPS_PORT=0

  caddy:
    build: ./caddy
    container_name: relay-caddy
    restart: unless-stopped
    network_mode: host
    environment:
      - RELAY_DOMAIN=relay.koder.wtf
      - RELAY_UPSTREAM=127.0.0.1:8080
      - ASK_URL=http://127.0.0.1:3000/api/internal/tls/ask
      - ACME_EMAIL=you@example.com
      - CLOUDFLARE_API_TOKEN=YOUR_TOKEN_HERE
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config: